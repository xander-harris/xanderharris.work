<style type="text/css">
	ul.tabs {
		font-size: 12pt;
		font-weight: bolder;
		margin: 0;
		padding: 0;
		float: left;
		list-style: none;
		height: 25px;
		/*--Set height of tabs original 32--*/
		border-bottom: 1px solid #999;
		border-left: 1px solid #999;
		width: 100%;
	}

	ul.tabs li {
		float: left;
		margin: 0;
		padding: 0;
		height: 24px;
		/*--Subtract 1px from the height of the unordered list original 31--*/
		line-height: 24px;
		/*--Vertically aligns the text within the tab original 31--*/
		border: 1px solid #999;
		border-left: none;
		margin-bottom: -1px;
		/*--Pull the list item down 1px--*/
		overflow: hidden;
		background: #e0e0e0;
	}

	ul.tabs li a {
		text-decoration: none;
		color: #000;
		display: block;
		padding: 0 20px;
		border: 1px solid #fff;
		/*--Gives the bevel look with a 1px white border inside the list item--*/
		outline: 1px solid black;
		/*none*/
	}

	ul.tabs li a:hover {
		background: #ccc;
	}

	html ul.tabs li.active,
	html ul.tabs li.active a:hover {
		/*--Makes sure that the active tab does not listen to the hover properties--*/
		background: #fff;
		border-bottom: 1px solid #fff;
		/*--Makes the active tab look like it's connected with its content--*/

	}

	body {
		font-family: sans-serif;
	}

	.tab_container {
		font-size: 10;

		border-top: none;

		float: left;
		width: 100%;

	}

	.tab_content {
		padding: 20px;

	}

	function ActivateTab() {
		$(document).ready(function () {
			//On Click Event
			$("ul.tabs li").click(function () {

				$("ul.tabs li").removeClass("active"); //Remove any "active" class
				$(this).addClass("active"); //Add "active" class to selected tab

				activetab = $(this).find("a").attr("href");

				var activeTab = $(this).find("a").attr("href"); //Find the href attribute value to identify the active tab + content

				$(activeTab).fadeIn(); //Fade in the active ID content
				return false;
			});

		});
	}

	function IsNumeric(sText) {
		var ValidChars = "-0123456789.";
		//   var FirstValidChars = "-0123456789.";
		var IsNumber = true;
		var Char;
		var i = 0;
		var decimalcount = 0;
		if (sText == null) { return false; }

		// Test for leading Neg
		Char = sText.charAt(0);
		if (Char == '.') { decimalcount++; }
		if (ValidChars.indexOf(Char) == -1 || decimalcount > 1) { IsNumber = false; }

		// Test remaining chars
		ValidChars = "0123456789.";
		for (i = 1; i < sText.length && IsNumber == true; i++) {
			Char = sText.charAt(i);
			if (Char == '.') { decimalcount++; }
			if (ValidChars.indexOf(Char) == -1 || decimalcount > 1) { IsNumber = false; }
		}
		return IsNumber;

	}

	function FormatCurrency(num) {
		num.value = num.toFixed(2);
	}



	function FormatNumber(num) {
		var retval = new Number(num);
		if (retval.toFixed(2) == 'NaN') { retval = 0; }
		return (retval.toFixed(2));
	}

	function Left(str, n) {
		if (n <= 0)
			return "";
		else if (n > String(str).length)
			return str;
		else
			return String(str).substring(0, n);
	}

	function Right(str, n) {
		if (n <= 0)
			return "";
		else if (n > String(str).length)
			return str;
		else {
			var iLen = String(str).length;
			return String(str).substring(iLen, iLen - n);
		}
	}
